name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: uv sync --dev

    - name: Lint
      run: uv run ruff check .

    - name: Test
      run: uv run pytest
