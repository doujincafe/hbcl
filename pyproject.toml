[project]
name = "heybrochecklog"
version = "1.4.9"
description = "A python tool for evaluating and working with EAC/XLD rip logs."
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "lights", email = "lights@tutanota.de"}
]
keywords = ["logchecker", "eac", "xld"]
requires-python = ">=3.12"
dependencies = [
    "chardet>=7.7.0",
    "faust-cchardet>=3.2.0",
    "pprp>=0.2.7",
]

[project.urls]
GitHub = "https://github.com/doujincafe/hbcl"

[project.scripts]
heybrochecklog = "heybrochecklog:main"
hbcl = "heybrochecklog:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["heybrochecklog"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["resources"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E203"]

[tool.ruff.format]
quote-style = "preserve"
